<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-label="Cursed energy: red and blue collide into a purple core behind an infinity barrier">
  <defs>
    <radialGradient id="redCore">
      <stop offset="0%" stop-color="#ffd9d9"/>
      <stop offset="35%" stop-color="#ff4d5e"/>
      <stop offset="100%" stop-color="#8c0f2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueCore">
      <stop offset="0%" stop-color="#dff4ff"/>
      <stop offset="35%" stop-color="#3fa9ff"/>
      <stop offset="100%" stop-color="#0b3a8c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleCore">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#e0b3ff"/>
      <stop offset="55%" stop-color="#8b2fd6"/>
      <stop offset="100%" stop-color="#2a0847" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fa9ff"/>
      <stop offset="50%" stop-color="#8b2fd6"/>
      <stop offset="100%" stop-color="#ff4d5e"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="frame"><rect width="860" height="200" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="860" height="200" fill="#05040c"/>

    <!-- drifting motes -->
    <g fill="#9fb0d0" opacity="0.5">
      <circle cx="90" cy="40" r="1.6"><animate attributeName="cy" values="40;170;40" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="150" r="1.2"><animate attributeName="cy" values="150;30;150" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="60" r="1.4"><animate attributeName="cy" values="60;180;60" dur="13s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="140" r="1.1"><animate attributeName="cy" values="140;25;140" dur="16s" repeatCount="indefinite"/></circle>
    </g>

    <!-- infinity barrier: rings that expand and fade, forever -->
    <g fill="none" stroke="#7cc4ff" stroke-width="1">
      <circle cx="430" cy="100" r="30" opacity="0">
        <animate attributeName="r" values="30;190" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="430" cy="100" r="30" opacity="0">
        <animate attributeName="r" values="30;190" dur="4s" begin="1.33s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="4s" begin="1.33s" repeatCount="indefinite"/>
      </circle>
      <circle cx="430" cy="100" r="30" opacity="0">
        <animate attributeName="r" values="30;190" dur="4s" begin="2.66s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="4s" begin="2.66s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- red and blue drift in, collide, and the purple core answers -->
    <g filter="url(#glow)">
      <circle cy="100" r="34" fill="url(#redCore)" cx="700">
        <animate attributeName="cx" values="700;446;446;700;700" dur="6s" repeatCount="indefinite"
                 keyTimes="0;0.34;0.62;0.86;1" calcMode="spline"
                 keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
        <animate attributeName="opacity" values="1;1;0.15;1;1" dur="6s" repeatCount="indefinite"
                 keyTimes="0;0.34;0.46;0.86;1"/>
      </circle>
      <circle cy="100" r="34" fill="url(#blueCore)" cx="120">
        <animate attributeName="cx" values="120;414;414;120;120" dur="6s" repeatCount="indefinite"
                 keyTimes="0;0.34;0.62;0.86;1" calcMode="spline"
                 keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
        <animate attributeName="opacity" values="1;1;0.15;1;1" dur="6s" repeatCount="indefinite"
                 keyTimes="0;0.34;0.46;0.86;1"/>
      </circle>
    </g>

    <!-- the imaginary mass between them -->
    <circle cx="430" cy="100" r="0" fill="url(#purpleCore)" filter="url(#glow)">
      <animate attributeName="r" values="0;0;58;44;52;0;0" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.36;0.44;0.5;0.58;0.72;1" calcMode="spline"
               keySplines="0 0 1 1;0.2 0 0 1;0.4 0 0.6 1;0.4 0 0.6 1;0.5 0 1 1;0 0 1 1"/>
    </circle>
    <circle cx="430" cy="100" r="0" fill="none" stroke="#e0b3ff" stroke-width="2" opacity="0">
      <animate attributeName="r" values="20;150" dur="6s" repeatCount="indefinite" keyTimes="0.42;1" calcMode="spline" keySplines="0.1 0 0 1"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite" keyTimes="0.4;0.46;0.75"/>
    </circle>

    <text x="430" y="176" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8fa0c0" letter-spacing="3">
      天上天下唯我独尊
      <animate attributeName="opacity" values="0.35;0.85;0.35" dur="6s" repeatCount="indefinite"/>
    </text>

    <rect x="0" y="196" width="860" height="4" fill="url(#rule)"/>
  </g>
</svg>

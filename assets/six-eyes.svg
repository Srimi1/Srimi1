<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Two burning cyan eyes flanking a hand reaching upward through embers">
  <defs>
    <radialGradient id="ember" cx="50%" cy="70%" r="78%">
      <stop offset="0%" stop-color="#ff8f2a"/>
      <stop offset="26%" stop-color="#e03a0c"/>
      <stop offset="58%" stop-color="#7a1206"/>
      <stop offset="100%" stop-color="#080201"/>
    </radialGradient>
    <radialGradient id="iris">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="14%" stop-color="#c9f8ff"/>
      <stop offset="40%" stop-color="#1fd0ff"/>
      <stop offset="72%" stop-color="#0a63d8"/>
      <stop offset="100%" stop-color="#031a45"/>
    </radialGradient>
    <radialGradient id="eyeGlow">
      <stop offset="0%" stop-color="#7fe9ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1b9bff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a5cc8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="handSkin" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2a0803"/>
      <stop offset="45%" stop-color="#b8420f"/>
      <stop offset="100%" stop-color="#ffb056"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1fd0ff"/>
      <stop offset="50%" stop-color="#ff8f2a"/>
      <stop offset="100%" stop-color="#1fd0ff"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </radialGradient>
    <filter id="bloom" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="rimGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="frame"><rect width="860" height="300" rx="18"/></clipPath>
    <path id="eyeShape" d="M -120 0 C -74 -60, 74 -60, 120 0 C 74 60, -74 60, -120 0 Z"/>
    <clipPath id="lidL"><use href="#eyeShape" x="176" y="104" transform="rotate(-9 176 104)"/></clipPath>
    <clipPath id="lidR"><use href="#eyeShape" x="684" y="104" transform="rotate(9 684 104)"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="860" height="300" fill="url(#ember)"/>

    <!-- flame licks off the floor -->
    <g filter="url(#rimGlow)" opacity="0.85">
      <path d="M300 300 C 288 250, 320 232, 306 196 C 296 234, 272 250, 300 300 Z" fill="#ff6a12" opacity="0.45">
        <animate attributeName="opacity" values="0.2;0.55;0.2" dur="2.9s" repeatCount="indefinite"/>
      </path>
      <path d="M560 300 C 574 244, 544 226, 558 190 C 570 228, 592 246, 560 300 Z" fill="#ff6a12" opacity="0.45">
        <animate attributeName="opacity" values="0.5;0.18;0.5" dur="3.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- embers -->
    <g fill="#ffc074">
      <circle cx="120" cy="320" r="2.4"><animate attributeName="cy" values="320;-20" dur="6.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.95;0" dur="6.4s" repeatCount="indefinite"/></circle>
      <circle cx="238" cy="320" r="1.7"><animate attributeName="cy" values="320;-20" dur="8.6s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="8.6s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="352" cy="320" r="2.1"><animate attributeName="cy" values="320;-20" dur="7.2s" begin="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7.2s" begin="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="508" cy="320" r="2.8"><animate attributeName="cy" values="320;-20" dur="5.9s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="5.9s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="642" cy="320" r="1.9"><animate attributeName="cy" values="320;-20" dur="9.1s" begin="3.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="9.1s" begin="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="768" cy="320" r="2.2"><animate attributeName="cy" values="320;-20" dur="7.8s" begin="4.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7.8s" begin="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="320" r="1.5"><animate attributeName="cy" values="320;-20" dur="10.5s" begin="5.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="10.5s" begin="5.8s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="320" r="1.6"><animate attributeName="cy" values="320;-20" dur="9.8s" begin="2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.75;0" dur="9.8s" begin="2.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ══════ left eye ══════ -->
    <g transform="rotate(-9 176 104)">
      <ellipse cx="176" cy="104" rx="176" ry="112" fill="url(#eyeGlow)" filter="url(#bloom)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3.1s" repeatCount="indefinite"/>
      </ellipse>
      <use href="#eyeShape" x="176" y="104" fill="#050d18"/>
    </g>
    <g clip-path="url(#lidL)">
      <circle cx="176" cy="104" r="44" fill="url(#iris)">
        <animate attributeName="r" values="44;37;44" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="176" cy="104" r="16" fill="#020a16">
        <animate attributeName="r" values="16;10;16" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="154" cy="86" r="6" fill="#ffffff" opacity="0.9"/>
      <circle cx="176" cy="104" r="44" fill="none" stroke="#a9f2ff" stroke-width="1.6" opacity="0">
        <animate attributeName="r" values="44;170" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.85;0" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <rect x="40" y="-4" width="272" height="220" fill="#080201">
        <animate attributeName="y" values="-220;-220;-4;-220;-220" dur="8s" repeatCount="indefinite" keyTimes="0;0.63;0.665;0.70;1"/>
      </rect>
    </g>
    <g transform="rotate(-9 176 104)">
      <use href="#eyeShape" x="176" y="104" fill="none" stroke="#ffd08a" stroke-width="3" opacity="0.95" filter="url(#rimGlow)"/>
      <use href="#eyeShape" x="176" y="104" fill="none" stroke="#fff4dd" stroke-width="1.2" opacity="0.9"/>
    </g>

    <!-- ══════ right eye ══════ -->
    <g transform="rotate(9 684 104)">
      <ellipse cx="684" cy="104" rx="176" ry="112" fill="url(#eyeGlow)" filter="url(#bloom)">
        <animate attributeName="opacity" values="1;0.7;1" dur="3.1s" repeatCount="indefinite"/>
      </ellipse>
      <use href="#eyeShape" x="684" y="104" fill="#050d18"/>
    </g>
    <g clip-path="url(#lidR)">
      <circle cx="684" cy="104" r="44" fill="url(#iris)">
        <animate attributeName="r" values="44;37;44" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="684" cy="104" r="16" fill="#020a16">
        <animate attributeName="r" values="16;10;16" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="662" cy="86" r="6" fill="#ffffff" opacity="0.9"/>
      <circle cx="684" cy="104" r="44" fill="none" stroke="#a9f2ff" stroke-width="1.6" opacity="0">
        <animate attributeName="r" values="44;170" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.85;0" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
      </circle>
      <rect x="548" y="-4" width="272" height="220" fill="#080201">
        <animate attributeName="y" values="-220;-220;-4;-220;-220" dur="8s" repeatCount="indefinite" keyTimes="0;0.63;0.665;0.70;1"/>
      </rect>
    </g>
    <g transform="rotate(9 684 104)">
      <use href="#eyeShape" x="684" y="104" fill="none" stroke="#ffd08a" stroke-width="3" opacity="0.95" filter="url(#rimGlow)"/>
      <use href="#eyeShape" x="684" y="104" fill="none" stroke="#fff4dd" stroke-width="1.2" opacity="0.9"/>
    </g>

    <!-- ══════ the hand, reaching ══════ -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 16; 0 -8; 0 16" dur="5.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.4 1;0.4 0 0.4 1"/>
      <ellipse cx="430" cy="180" rx="104" ry="126" fill="#ff7a1a" opacity="0.55" filter="url(#bloom)">
        <animate attributeName="opacity" values="0.38;0.7;0.38" dur="3.3s" repeatCount="indefinite"/>
      </ellipse>
      <g transform="translate(430 300) scale(1.34) translate(-430 -300)">
        <path fill="url(#handSkin)" stroke="#ffd9a0" stroke-width="1.1" stroke-linejoin="round" d="
          M406 300
          L402 250
          C396 240 388 232 380 222
          C368 208 356 196 362 188
          C369 180 382 192 392 206
          C395 214 398 220 400 226
          C399 208 399 190 400 176
          C401 158 404 138 411 136
          C418 134 419 152 419 172
          C419 184 419 194 420 202
          C420 182 421 156 424 138
          C426 122 431 116 436 118
          C442 120 442 142 441 164
          C440 178 440 192 440 202
          C442 184 445 162 449 150
          C453 136 459 132 463 136
          C468 141 466 162 463 180
          C461 192 460 198 459 206
          C462 194 466 182 470 176
          C476 168 482 170 483 178
          C484 190 476 214 468 232
          C463 244 460 248 458 254
          L456 300
          Z">
          <animate attributeName="opacity" values="1;1" dur="6s" repeatCount="indefinite"/>
        </path>
        <path d="M406 300 L402 262 Q430 254 456 262 L456 300 Z" fill="#140301" opacity="0.9"/>
      </g>
    </g>

    <rect width="860" height="300" fill="url(#vignette)"/>
    <rect x="0" y="296" width="860" height="4" fill="url(#rule)"/>
  </g>
</svg>

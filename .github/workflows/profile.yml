name: Refresh profile
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Install GIF optimizer
        run: sudo apt-get update && sudo apt-get install --yes gifsicle
      - run: npm test
      - run: npm run refresh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Render contribution-day autopilot story
        run: npm run render:story
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Commit verified public data, charts, and README story
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data assets docs/assets/together/cover.jpg README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Code Together from public contribution days'
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: refresh
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy profile with refreshed public data
        id: deployment
        uses: actions/deploy-pages@v4

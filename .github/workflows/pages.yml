name: Publish profile
on:
  push:
    branches: [main]
    paths:
      [
        "README.md",
        "assets/**",
        "docs/**",
        "tests/**",
        "scripts/**",
        "package*.json",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - name: Verify desktop and mobile portfolio
        run: |
          PORT=8084 node scripts/preview-server.mjs > /tmp/profile-preview.log 2>&1 &
          curl --silent --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8084/ > /dev/null
          CHROME_BIN=/usr/bin/google-chrome npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-browser-checks
          path: qa/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
